spring.application.name=job-service

server.port=${PORT:8081}
server.address=0.0.0.0

# Use Railway PostgreSQL when DB_URL/DATABASE_URL is supplied.
# Fall back to an in-memory H2 database so the service can start without a database service.
spring.datasource.url=${DB_URL:${DATABASE_URL:jdbc:h2:mem:distributed_jobs}}
spring.datasource.username=${DB_USERNAME:${PGUSER:sa}}
spring.datasource.password=${DB_PASSWORD:${PGPASSWORD:}}

jobs.max-queued=100

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.probes.add-additional-paths=true
management.endpoint.health.show-details=always
