spring.application.name=job-service

server.port=${PORT:8081}
server.address=0.0.0.0

spring.datasource.url=${DB_URL:${DATABASE_URL:jdbc:postgresql://${PGHOST:postgres}:${PGPORT:5432}/${PGDATABASE:distributed_jobs}}}
spring.datasource.username=${DB_USERNAME:${PGUSER:postgres}}
spring.datasource.password=${DB_PASSWORD:${PGPASSWORD:postgres123}}

jobs.max-queued=100

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=always
