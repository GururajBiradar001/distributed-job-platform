spring.application.name=worker-service

server.port=8082

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}

spring.kafka.consumer.group-id=${KAFKA_CONSUMER_GROUP:job-workers}
spring.kafka.consumer.auto-offset-reset=earliest

logging.level.org.springframework.kafka=DEBUG
logging.level.org.apache.kafka.clients.consumer=INFO
logging.level.org.springframework.kafka.listener=INFO
logging.level.org.apache.kafka.clients.consumer.internals.ConsumerCoordinator=INFO

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always