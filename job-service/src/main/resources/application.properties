spring.application.name=job-service

server.port=${PORT:8081}
server.address=0.0.0.0

# Railway PostgreSQL connection.
# DATABASE_URL is intentionally not used directly because Railway provides it as postgres://...
# while Spring Boot requires a JDBC URL.
spring.datasource.url=jdbc:postgresql://${PGHOST:localhost}:${PGPORT:5432}/${PGDATABASE:distributed_jobs}
spring.datasource.username=${PGUSER:postgres}
spring.datasource.password=${PGPASSWORD:postgres123}
spring.datasource.driver-class-name=org.postgresql.Driver

# Hibernate can determine the PostgreSQL dialect from JDBC metadata once the datasource is reachable.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

jobs.max-queued=100

spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:kafka:9092}

management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.probes.add-additional-paths=true
management.endpoint.health.show-details=always
